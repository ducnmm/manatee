<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>manatee</title>
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="Get test mtee, then send on X." />
    <link rel="icon" href="/favicon.ico?v=7" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=7" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=7" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=7" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="page">
      <div class="stage">
        <section id="home" class="hero view is-on" aria-hidden="false">
          <button id="connect" type="button" class="btn corner">Connect wallet</button>
          <div class="home-cluster">
            <img class="mascot" src="/manatee-home-mascot.png" alt="" draggable="false" />
            <form id="home-search" class="search" autocomplete="off" role="search">
              <label class="sr-only" for="query">Search handle</label>
              <div class="search-field">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.4" />
                  <path
                    d="M16.5 16.5L21 21"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                  />
                </svg>
                <input id="query" placeholder="@alice" />
              </div>
            </form>
            <ul id="search-results" class="results"></ul>
            <p id="home-status" class="status"></p>
          </div>
        </section>

        <section id="dash" class="dash view" aria-hidden="true" inert>
          <div id="account-menu" class="account-menu">
            <button id="account-trigger" type="button">
              <span id="dash-addr"></span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M6 9l6 6 6-6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div id="account-dropdown" class="account-dropdown">
              <button id="copy-addr" type="button">Copy address</button>
              <button id="home-link" type="button">Search</button>
              <button id="disconnect" type="button">Disconnect</button>
            </div>
          </div>

          <div class="dash-wrap">
            <section class="hero-bal">
              <div class="hero-bal-main">
                <img class="token-lg" src="/apple-touch-icon.png" alt="" />
                <strong id="hero-mtee">—</strong>
              </div>
              <button id="faucet" type="button" class="btn">Get 10 mtee →</button>
            </section>
            <p id="status" class="status dash-status"></p>

            <div class="dash-main">
              <nav class="dash-tabs">
                <button id="tab-overview" type="button" class="tab on" aria-label="Overview" title="Overview">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.4" />
                    <rect x="13" y="3" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.4" />
                    <rect x="3" y="13" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.4" />
                    <rect x="13" y="13" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.4" />
                  </svg>
                </button>
                <button id="tab-activity" type="button" class="tab" aria-label="Activity" title="Activity">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M4 14l4-6 4 8 3-5 5 3"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.4"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
              </nav>

              <div class="panel">
                <div class="panel-stack">
                <div id="overview" class="pane is-on">
                  <button id="wallet-bar" type="button">
                    <span id="wallet-label">Connected</span>
                    <span class="copy-tile" aria-hidden="true">
                      <svg viewBox="0 0 24 24">
                        <rect x="8" y="8" width="11" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
                        <path d="M6 16H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="2" />
                      </svg>
                    </span>
                  </button>
                  <div class="token-grid">
                    <div class="token-tile" title="Sepolia ETH">
                      <span class="token-ic eth" aria-hidden="true">
                        <svg viewBox="0 0 32 32">
                          <circle cx="16" cy="16" r="16" fill="#627eea" />
                          <path fill="#fff" fill-opacity=".75" d="M16.4 5.2v8.1l6.9 3.1z" />
                          <path fill="#fff" d="M16.4 5.2 9.5 16.4l6.9-3.1z" />
                          <path fill="#fff" fill-opacity=".75" d="M16.4 21.1v5.7l6.9-9.6z" />
                          <path fill="#fff" d="M16.4 26.8v-5.7l-6.9-3.9z" />
                        </svg>
                      </span>
                      <div class="token-meta">
                        <strong id="bal-eth">—</strong>
                        <span>ETH</span>
                      </div>
                    </div>
                    <div class="token-tile" title="mtee · Sepolia">
                      <img class="token-ic" src="/apple-touch-icon.png" alt="" />
                      <div class="token-meta">
                        <strong id="bal-mtee">—</strong>
                        <span>mtee</span>
                      </div>
                    </div>
                    <div class="token-tile" title="mtee · Creditcoin">
                      <img class="token-ic" src="/apple-touch-icon.png" alt="" />
                      <div class="token-meta">
                        <strong id="bal-cc3">—</strong>
                        <span>mtee · cc3</span>
                      </div>
                    </div>
                  </div>
                </div>
                <div id="activity" class="pane">
                  <div id="activity-list" class="activity-list"></div>
                </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
