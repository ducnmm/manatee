<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>manatee</title>
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="Get test mtee, then send on X." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="page">
      <div class="stage">
        <button id="connect" type="button" class="btn corner">Connect wallet</button>

        <section class="hero">
          <img class="mascot" src="/manatee-home-mascot.png" alt="" draggable="false" />
          <form id="deposit" class="deposit" autocomplete="off">
            <label class="sr-only" for="handle">X handle</label>
            <input id="handle" placeholder="@alice" />
            <button id="faucet" type="submit" class="btn">Get 10 mtee →</button>
          </form>
          <p id="status" class="status"></p>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
