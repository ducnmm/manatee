<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>manatee</title>
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="Get test mtee, then send on X." />
    <link rel="icon" href="/favicon.ico?v=7" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=7" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=7" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=7" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="page">
      <div class="stage">
        <section id="home" class="hero">
          <button id="connect" type="button" class="btn corner">Connect wallet</button>
          <div class="home-cluster">
            <img class="mascot" src="/manatee-home-mascot.png" alt="" draggable="false" />
            <form id="home-search" class="search" autocomplete="off" role="search">
              <label class="sr-only" for="query">Search handle</label>
              <div class="search-field">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.4" />
                  <path
                    d="M16.5 16.5L21 21"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                  />
                </svg>
                <input id="query" placeholder="@alice" />
              </div>
            </form>
            <ul id="search-results" class="results"></ul>
            <p id="home-status" class="status"></p>
          </div>
        </section>

        <section id="dash" class="dash" hidden>
          <header class="dash-bar">
            <button id="home-link" type="button" class="wordmark">manatee</button>
            <div class="dash-account">
              <span id="dash-addr"></span>
              <button id="disconnect" type="button" class="btn ghost">Disconnect</button>
            </div>
          </header>
          <div class="dash-body">
            <h1>Dashboard</h1>
            <div class="dash-grid">
              <article class="card">
                <h2>Balances</h2>
                <ul class="balances">
                  <li><span>Sepolia ETH</span><strong id="bal-eth">—</strong></li>
                  <li><span>mtee · Sepolia</span><strong id="bal-mtee">—</strong></li>
                  <li><span>mtee · Creditcoin</span><strong id="bal-cc3">—</strong></li>
                </ul>
              </article>
              <article class="card">
                <h2>Get mtee</h2>
                <form id="deposit" class="deposit" autocomplete="off">
                  <button id="faucet" type="submit" class="btn">Get 10 mtee →</button>
                </form>
                <p id="status" class="status"></p>
              </article>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
