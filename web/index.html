<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>manatee</title>
    <meta name="theme-color" content="#c6fab4" />
    <meta name="description" content="Get test mtee, then send on X." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Unbounded:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="page">
      <div class="stage">
        <button id="connect" type="button" class="btn corner">Connect wallet</button>

        <section class="hero">
          <img class="mascot" src="/manatee-home-mascot.png" alt="" draggable="false" />
          <form id="deposit" class="deposit" autocomplete="off">
            <label class="sr-only" for="handle">X handle</label>
            <input id="handle" placeholder="@alice" />
            <button id="faucet" type="submit" class="btn">Get 10 mtee</button>
          </form>
          <p id="status" class="status"></p>
        </section>

        <div class="marquee" aria-hidden="true">
          <div class="marquee-track">
            <div class="chip yellow"><code>@manatee send 10 mtee @bob</code></div>
            <div class="chip cyan"><code>@manatee register @alice 0x…</code></div>
            <div class="chip lime"><code>@manatee send 1.5 mtee @bob</code></div>
            <div class="chip yellow"><code>@manatee send 10 mtee @bob</code></div>
            <div class="chip cyan"><code>@manatee register @alice 0x…</code></div>
            <div class="chip lime"><code>@manatee send 1.5 mtee @bob</code></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
